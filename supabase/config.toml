# Minimal Supabase CLI config for local development and migrations.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "civicsync"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false

[auth.email]
enabled = false
enable_confirmations = false
